<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TETRI-CORE - Paused</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#003915",
                      "inverse-on-surface": "#303032",
                      "on-tertiary-fixed-variant": "#3a485c",
                      "on-surface": "#e4e2e4",
                      "surface": "#131315",
                      "outline-variant": "#45464d",
                      "on-primary-container": "#798098",
                      "error": "#ffb4ab",
                      "surface-container-highest": "#353436",
                      "on-secondary-fixed": "#002109",
                      "error-container": "#93000a",
                      "surface-container": "#1f1f21",
                      "outline": "#909097",
                      "primary-fixed": "#dae2fd",
                      "background": "#131315",
                      "on-error": "#690005",
                      "on-background": "#e4e2e4",
                      "inverse-surface": "#e4e2e4",
                      "secondary": "#4ae176",
                      "primary-fixed-dim": "#bec6e0",
                      "on-secondary-container": "#004119",
                      "surface-dim": "#131315",
                      "surface-tint": "#bec6e0",
                      "primary": "#bec6e0",
                      "on-primary": "#283044",
                      "surface-container-high": "#2a2a2b",
                      "surface-container-low": "#1b1b1d",
                      "on-primary-fixed": "#131b2e",
                      "secondary-fixed-dim": "#4ae176",
                      "on-secondary-fixed-variant": "#005321",
                      "on-tertiary-container": "#738298",
                      "tertiary-fixed-dim": "#b9c7e0",
                      "secondary-container": "#00b954",
                      "tertiary-container": "#09182a",
                      "surface-bright": "#39393b",
                      "surface-container-lowest": "#0e0e10",
                      "on-error-container": "#ffdad6",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-tertiary-fixed": "#0d1c2f",
                      "secondary-fixed": "#6bff8f",
                      "tertiary-fixed": "#d5e3fd",
                      "inverse-primary": "#565e74",
                      "tertiary": "#b9c7e0",
                      "on-tertiary": "#233144",
                      "on-surface-variant": "#c6c6cd",
                      "primary-container": "#0f172a",
                      "surface-variant": "#353436"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "cell-size": "32px",
                      "margin": "24px",
                      "gutter": "16px",
                      "touch-target": "44px",
                      "board-width": "320px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "body-base": [
                              "Hanken Grotesk"
                      ],
                      "mono-score": [
                              "JetBrains Mono"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "display": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "mono-label": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "body-base": [
                              "16px",
                              {
                                      "lineHeight": "1.5",
                                      "fontWeight": "400"
                              }
                      ],
                      "mono-score": [
                              "20px",
                              {
                                      "lineHeight": "1.0",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "1.3",
                                      "fontWeight": "600"
                              }
                      ],
                      "display": [
                              "48px",
                              {
                                      "lineHeight": "1.1",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "800"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "fontWeight": "700"
                              }
                      ],
                      "mono-label": [
                              "12px",
                              {
                                      "lineHeight": "1.0",
                                      "fontWeight": "500"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Simulated Game Board Background */
        .bg-game-board {
            background-color: #0F172A;
            background-image: 
                linear-gradient(#334155 1px, transparent 1px),
                linear-gradient(90deg, #334155 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center top;
        }

        /* Glass Overlay specific to guidance */
        .glass-overlay {
            backdrop-filter: blur(12px);
            background-color: rgba(17, 24, 39, 0.4); /* #111827 at 40% */
            border: 1px solid #334155;
        }
        
        /* Button Glows */
        .btn-glow-primary {
            box-shadow: 0 0 15px rgba(74, 225, 118, 0.3); /* secondary color glow */
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Simulated Game Background (Level 0) -->
<div class="absolute inset-0 bg-game-board opacity-30 z-0"></div>
<!-- Dummy Game Pieces to make it look like a real game is paused behind -->
<div class="absolute inset-0 z-0 flex justify-center mt-20 pointer-events-none">
<div class="w-board-width h-[640px] border border-surface-variant relative">
<!-- T-Piece (Active/Ghost simulation) -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 flex flex-col items-center opacity-40">
<div class="w-cell-size h-cell-size bg-secondary border border-surface-variant"></div>
<div class="flex">
<div class="w-cell-size h-cell-size bg-secondary border border-surface-variant"></div>
<div class="w-cell-size h-cell-size bg-secondary border border-surface-variant"></div>
<div class="w-cell-size h-cell-size bg-secondary border border-surface-variant"></div>
</div>
</div>
<!-- Stacked Pieces -->
<div class="absolute bottom-0 left-0 right-0 h-32 flex flex-wrap opacity-20">
<div class="w-cell-size h-cell-size bg-primary border border-surface-variant ml-[32px]"></div>
<div class="w-cell-size h-cell-size bg-tertiary border border-surface-variant"></div>
<div class="w-cell-size h-cell-size bg-error border border-surface-variant ml-[64px]"></div>
</div>
</div>
</div>
<!-- Top Navigation Shell - Included as requested for context, though highly minimal due to pause state -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin h-touch-target bg-background/80 backdrop-blur-xl border-b border-outline-variant text-primary font-headline-md text-headline-md">
<div class="font-display text-headline-lg font-extrabold tracking-tighter text-secondary">TETRI-CORE</div>
<div class="flex gap-4">
<button aria-label="Pause" class="hover:text-secondary transition-colors duration-200 opacity-70">
<span class="material-symbols-outlined" data-icon="pause">pause</span>
</button>
<button aria-label="Settings" class="hover:text-secondary transition-colors duration-200 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</nav>
<!-- Side Navigation Shell - Hidden on mobile, visible on desktop, reflecting 'Marathon' active state -->
<aside class="hidden md:flex fixed left-0 top-0 h-full flex-col pt-20 z-40 bg-surface-container-low/90 backdrop-blur-lg border-r border-outline-variant w-board-width text-primary font-mono-label text-mono-label uppercase tracking-widest">
<div class="px-margin mb-8">
<h2 class="font-display text-headline-md text-primary">COMMAND</h2>
<p class="text-on-surface-variant opacity-60 mt-1">V.1.0.4</p>
</div>
<nav class="flex flex-col flex-grow">
<!-- Active State: Marathon -->
<a class="flex items-center px-margin py-4 bg-secondary-container text-on-secondary-container font-bold border-l-4 border-secondary scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mr-4" data-icon="timer">timer</span>
                Marathon
            </a>
<!-- Inactive States -->
<a class="flex items-center px-margin py-4 text-on-surface-variant opacity-60 hover:bg-surface-variant hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined mr-4" data-icon="bolt">bolt</span>
                Sprint
            </a>
<a class="flex items-center px-margin py-4 text-on-surface-variant opacity-60 hover:bg-surface-variant hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined mr-4" data-icon="military_tech">military_tech</span>
                Ultra
            </a>
<a class="flex items-center px-margin py-4 text-on-surface-variant opacity-60 hover:bg-surface-variant hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined mr-4" data-icon="groups">groups</span>
                Versus
            </a>
</nav>
</aside>
<!-- PAUSE MENU OVERLAY (Level 2) -->
<div class="absolute inset-0 z-50 flex items-center justify-center p-4">
<!-- The Glass Panel spanning the central interaction area -->
<div class="glass-overlay w-full max-w-sm rounded-lg p-8 flex flex-col items-center relative overflow-hidden">
<!-- Decorative scanline effect inside the glass -->
<div class="absolute inset-0 pointer-events-none opacity-10 bg-[linear-gradient(transparent_50%,rgba(0,0,0,0.5)_50%)] bg-[length:100%_4px]"></div>
<!-- Header -->
<div class="mb-10 text-center relative z-10">
<h1 class="font-display text-display text-primary tracking-widest uppercase" style="letter-spacing: 0.1em;">Paused</h1>
<div class="w-12 h-1 bg-secondary mx-auto mt-2 rounded-full opacity-80"></div>
<!-- Small status indicators below header -->
<div class="flex justify-center gap-6 mt-4 opacity-70">
<div class="flex flex-col items-center">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase">Score</span>
<span class="font-mono-score text-mono-score text-primary">042,500</span>
</div>
<div class="w-px bg-outline-variant h-8"></div>
<div class="flex flex-col items-center">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase">Level</span>
<span class="font-mono-score text-mono-score text-secondary">08</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4 relative z-10">
<!-- Primary Action: Resume -->
<button class="w-full h-touch-target bg-secondary text-on-secondary font-headline-md text-headline-md rounded flex items-center justify-center gap-2 hover:bg-secondary-fixed transition-colors btn-glow-primary active:scale-95 duration-150">
<span class="material-symbols-outlined fill" data-icon="play_arrow">play_arrow</span>
                    Resume
                </button>
<!-- Secondary Actions: Ghost Style -->
<button class="w-full h-touch-target bg-transparent border border-outline-variant text-primary font-headline-md text-[20px] rounded flex items-center justify-center gap-2 hover:bg-surface-variant hover:text-on-surface transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="replay">replay</span>
                    Restart Game
                </button>
<button class="w-full h-touch-target bg-transparent border border-outline-variant text-primary font-headline-md text-[20px] rounded flex items-center justify-center gap-2 hover:bg-surface-variant hover:text-on-surface transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
                    Settings
                </button>
<!-- Destructive/Exit Action -->
<button class="w-full h-touch-target bg-transparent border border-error/50 text-error font-headline-md text-[20px] rounded flex items-center justify-center gap-2 mt-4 hover:bg-error/10 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                    Quit to Menu
                </button>
</div>
</div>
</div>
</body></html>
