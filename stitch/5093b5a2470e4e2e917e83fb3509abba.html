<style>
        .tetris-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            grid-template-rows: repeat(20, minmax(0, 1fr));
            gap: 1px;
            background-color: #334155; /* Board border lines */
            border: 1px solid #334155;
        }
        .tetris-cell {
            background-color: #0F172A; /* Void */
            aspect-ratio: 1 / 1;
        }
        .block-i { background-color: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
        .block-j { background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .block-l { background-color: #f97316; box-shadow: 0 0 10px #f97316; }
        .block-o { background-color: #eab308; box-shadow: 0 0 10px #eab308; }
        .block-s { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .block-t { background-color: #a855f7; box-shadow: 0 0 10px #a855f7; }
        .block-z { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .ghost-block-t {
            border: 1px dashed #a855f7;
