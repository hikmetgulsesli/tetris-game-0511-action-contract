<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetri-Core</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#003915",
                        "inverse-on-surface": "#303032",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "on-surface": "#e4e2e4",
                        "surface": "#131315",
                        "outline-variant": "#45464d",
                        "on-primary-container": "#798098",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#353436",
                        "on-secondary-fixed": "#002109",
                        "error-container": "#93000a",
                        "surface-container": "#1f1f21",
                        "outline": "#909097",
                        "primary-fixed": "#dae2fd",
                        "background": "#131315",
                        "on-error": "#690005",
                        "on-background": "#e4e2e4",
                        "inverse-surface": "#e4e2e4",
                        "secondary": "#4ae176",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-container": "#004119",
                        "surface-dim": "#131315",
                        "surface-tint": "#bec6e0",
                        "primary": "#bec6e0",
                        "on-primary": "#283044",
                        "surface-container-high": "#2a2a2b",
                        "surface-container-low": "#1b1b1d",
                        "on-primary-fixed": "#131b2e",
                        "secondary-fixed-dim": "#4ae176",
                        "on-secondary-fixed-variant": "#005321",
                        "on-tertiary-container": "#738298",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "secondary-container": "#00b954",
                        "tertiary-container": "#09182a",
                        "surface-bright": "#39393b",
                        "surface-container-lowest": "#0e0e10",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary-fixed": "#0d1c2f",
                        "secondary-fixed": "#6bff8f",
                        "tertiary-fixed": "#d5e3fd",
                        "inverse-primary": "#565e74",
                        "tertiary": "#b9c7e0",
                        "on-tertiary": "#233144",
                        "on-surface-variant": "#c6c6cd",
                        "primary-container": "#0f172a",
                        "surface-variant": "#353436"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "cell-size": "32px",
                        "margin": "24px",
                        "gutter": "16px",
                        "touch-target": "44px",
                        "board-width": "320px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-base": ["Hanken Grotesk"],
                        "mono-score": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "mono-label": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "mono-score": ["20px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "mono-label": ["12px", { "lineHeight": "1.0", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base text-body-base min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Grid Background -->
<div class="absolute inset-0 z-0 pointer-events-none" style="background-image: linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px); background-size: 32px 32px; opacity: 0.1;"></div>
<!-- Main Container -->
<main class="z-10 flex flex-col items-center w-full max-w-[board-width] px-margin relative">
<!-- High Score Badge -->
<div class="absolute -top-32 w-full flex justify-center">
<div class="bg-surface-container-low border border-outline-variant px-6 py-3 rounded-lg flex flex-col items-center shadow-[0_0_15px_rgba(74,225,118,0.1)] backdrop-blur-md">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-widest mb-1">High Score</span>
<span class="font-mono-score text-mono-score text-secondary">999,999</span>
</div>
</div>
<!-- Logo -->
<h1 class="font-display text-display text-primary mb-12 text-center tracking-tighter shadow-primary/20 drop-shadow-xl" style="text-shadow: 0 0 20px rgba(190,198,224,0.3);">
            TETRI-CORE
        </h1>
<!-- Navigation Buttons -->
<div class="flex flex-col gap-unit w-full">
<button class="bg-primary text-on-primary h-touch-target rounded font-headline-md text-headline-md flex items-center justify-center relative overflow-hidden group hover:bg-primary-fixed transition-colors shadow-[0_0_20px_rgba(190,198,224,0.2)] hover:shadow-[0_0_30px_rgba(190,198,224,0.4)]">
<span class="relative z-10">New Game</span>
</button>
<button class="bg-surface-container text-on-surface border border-outline-variant h-touch-target rounded font-headline-md text-headline-md flex items-center justify-center hover:bg-surface-variant transition-colors">
                Resume
            </button>
<button class="bg-surface-container text-on-surface border border-outline-variant h-touch-target rounded font-headline-md text-headline-md flex items-center justify-center hover:bg-surface-variant transition-colors">
                Options
            </button>
<button class="bg-surface-container text-on-surface border border-outline-variant h-touch-target rounded font-headline-md text-headline-md flex items-center justify-center hover:bg-surface-variant transition-colors">
                Help
            </button>
</div>
</main>
<!-- Version Number -->
<div class="absolute bottom-margin text-center w-full z-10">
<span class="font-mono-label text-mono-label text-on-surface-variant opacity-50">v1.0.4 - COMMAND CENTER</span>
</div>
</body></html>
